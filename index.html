function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

/* ---------------- Toast ---------------- */
let toastTimer = null;
function toast(msg, ms = 2600) {
  let t = document.getElementById("ts-toast");
  if (!t) {
    t = h("div", { id: "ts-toast" });
    document.getElementById("ts-main").appendChild(t);
  }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}

    if (!it) continue;
    if (it === "-") { el.appendChild(h("div", { class: "ts-dd-sep" })); continue; }
    if (it.head) { el.appendChild(h("div", { class: "ts-dd-head" }, it.head)); continue; }
    if (it.node) { el.appendChild(it.node); continue; } // live content (e.g. "What's here")

      "div",
      { class: "ts-dd-item" + (it.disabled ? " disabled" : "") },
      h("span", it.color ? { style: { color: it.color } } : {}, label),
      it.key ? h("span", { class: "k" }, it.key) : null

      } catch (err) {

  el.style.left = Math.max(4, Math.min(x, window.innerWidth - r.width - 4)) + "px";
  el.style.top = Math.max(4, Math.min(y, window.innerHeight - r.height - 4)) + "px";

/**
 * showDialog({title, body: Node, buttons:[{label, primary, danger, action(): bool|void}], onClose, width})
 * action returning false keeps the dialog open.

    h("div", { class: "ts-dialog-head" }, title),
    h("div", { class: "ts-dialog-body" }, body),
    foot
  );
  const dlg = { el, onClose };
  for (const b of buttons) {
    const btn = h("button", { class: b.primary ? "primary" : b.danger ? "danger" : "" }, b.label);
    btn.onclick = async () => {
      const keep = b.action ? await b.action() : undefined;
      if (keep === false) return;
      if (activeDialog === dlg) {
        activeDialog = null;
        el.remove();
        if (!b.skipOnClose && onClose) onClose(b.label);

    foot.appendChild(btn);

  el.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") {
      e.preventDefault();

      p && p.click();

      e.preventDefault();
      foot.lastElementChild && foot.lastElementChild.click();
    }
    e.stopPropagation();

  const head = el.firstChild;
  head.addEventListener("mousedown", (e) => {
    const r = el.getBoundingClientRect();
    const pr = el.parentElement.getBoundingClientRect();
    const ox = e.clientX - r.left, oy = e.clientY - r.top;
    el.style.transform = "none";
    const move = (ev) => {
      el.style.left = ev.clientX - pr.left - ox + "px";
      el.style.top = ev.clientY - pr.top - oy + "px";
    };
    const up = () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);

  setTimeout(() => {
    const f = el.querySelector("input:not([type=checkbox]),textarea,select");
    if (f) { f.focus(); f.select && f.select(); }
  }, 30);
  return dlg;
}

/** Simple promise-based confirm with 3 choices */
function askChoice(title, message, choices) {
  return new Promise((resolve) => {
    showDialog({
      title,
      body: h("div", { class: "ts-hint", style: { opacity: 0.9, fontSize: "13px" } }, message),
      buttons: choices.map((c) => ({ label: c.label, primary: c.primary, danger: c.danger, action: () => resolve(c.value), skipOnClose: true })),
      onClose: () => resolve(null),
    });
  });
}
function askText(title, label, value) {
  return new Promise((resolve) => {
    const input = h("input", { type: "text", value: value || "" });
    showDialog({
      title,
      body: h("label", {}, label, input),
      buttons: [
        { label: "OK", primary: true, action: () => resolve(input.value.trim()), skipOnClose: true },
        { label: "Cancel", action: () => resolve(null), skipOnClose: true },
      ],
      onClose: () => resolve(null),
    });
  });
}

/* ---------------- Clipboard ---------------- */
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = h("textarea", { style: { position: "fixed", left: "-9999px" } });
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e2) { /* ignore */ }
    ta.remove();
  }
  toast("Copied: " + text);
}

/* ---------------- Downloads ---------------- */
function downloadBlob(blob, fileName) {
  const a = h("a", { href: URL.createObjectURL(blob), download: fileName });
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 20000);
}

const idb = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      setTimeout(() => rej(new Error("IndexedDB timeout")), 2500);
      const r = indexedDB.open("terrainScout", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async get(key) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const r = db.transaction("kv").objectStore("kv").get(key);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async set(key, val) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").put(val, key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  },
};

function gpxToKml(text, name) {
  const dom = new DOMParser().parseFromString(text, "application/xml");
  if (dom.getElementsByTagName("parsererror").length) throw new Error("This file isn't valid GPX.");
  const all = (el, tag) => [...el.getElementsByTagNameNS("*", tag)];
  const kid = (el, tag) => [...el.children].find((c) => c.localName === tag);
  const txt = (el, tag) => { const c = kid(el, tag); return c ? c.textContent.trim() : ""; };
  const esc = escapeHtml;
  const readPts = (els) => els.map((p) => ({
    lat: parseFloat(p.getAttribute("lat")), lon: parseFloat(p.getAttribute("lon")),
    ele: parseFloat(txt(p, "ele")), time: txt(p, "time") ? Date.parse(txt(p, "time")) : NaN,
  })).filter((p) => Number.isFinite(p.lat) && Number.isFinite(p.lon));
  const coordStr = (pts) => pts.map((p) => `${p.lon.toFixed(7)},${p.lat.toFixed(7)},${Number.isFinite(p.ele) ? p.ele.toFixed(1) : 0}`).join(" ");

    let dist = 0, gain = 0, loss = 0, max = -Infinity, min = Infinity, t0 = NaN, t1 = NaN;
    for (const s of segs) {
      let anchor = null;
      s.forEach((p, i) => {
        if (i) dist += haversine(s[i - 1].lat, s[i - 1].lon, p.lat, p.lon);
        if (Number.isFinite(p.ele)) {
          max = Math.max(max, p.ele); min = Math.min(min, p.ele);
          if (anchor === null) anchor = p.ele;
          else if (Math.abs(p.ele - anchor) >= 5) { if (p.ele > anchor) gain += p.ele - anchor; else loss += anchor - p.ele; anchor = p.ele; }
        }
        if (Number.isFinite(p.time)) {
          t0 = Number.isFinite(t0) ? Math.min(t0, p.time) : p.time;
          t1 = Number.isFinite(t1) ? Math.max(t1, p.time) : p.time;
        }
      });
    }
    const lines = [`Distance: ${fmtDist(dist)}`];
    if (Number.isFinite(t0)) lines.unshift(`Date: ${new Date(t0).toISOString().slice(0, 10)}`);
    if (Number.isFinite(t0) && t1 > t0) {
      const m = Math.round((t1 - t0) / 60000);
      lines.push(`Duration: ${Math.floor(m / 60)} h ${m % 60} min`);
    }
    if (Number.isFinite(max)) lines.push(`Elevation gain: ${Math.round(gain)} m · loss: ${Math.round(loss)} m`, `Highest: ${fmtElev(max)} · lowest: ${fmtElev(min)}`);

  let tracks = 0, waypoints = 0;
  const trackXml = [];
  for (const [tag, ptTag, label] of [["trk", "trkpt", "Track"], ["rte", "rtept", "Route"]]) {
    for (const t of all(dom, tag)) {
      const segs = tag === "trk" ? all(t, "trkseg").map((s) => readPts(all(s, ptTag))) : [readPts(all(t, ptTag))];
      const good = segs.filter((s) => s.length > 1);
      if (!good.length) continue;
      tracks++;
      const nm = txt(t, "name") || `${label} ${tracks}`;
      const desc = [txt(t, "desc"), stats(good)].filter(Boolean).join("\n\n");
      const geom = good.length === 1
        ? `<LineString><tessellate>1</tessellate><altitudeMode>clampToGround</altitudeMode><coordinates>${coordStr(good[0])}</coordinates></LineString>`
        : `<MultiGeometry>${good.map((s) => `<LineString><tessellate>1</tessellate><altitudeMode>clampToGround</altitudeMode><coordinates>${coordStr(s)}</coordinates></LineString>`).join("")}</MultiGeometry>`;

    const d = [txt(w.el, "desc") || txt(w.el, "cmt"), Number.isFinite(w.p.ele) ? `GPS elevation: ${fmtElev(w.p.ele)}` : ""].filter(Boolean).join("\n");

  }

  const xml =
    '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2" xmlns:gx="http://www.google.com/kml/ext/2.2"><Document>' +
    `<name>${esc(name)}</name><open>1</open>` +
    `<Style id="gpxTrack"><LineStyle><color>${lineColor}</color><width>3</width></LineStyle></Style>` +
    `<Style id="gpxWpt"><IconStyle><color>${cssToKmlColor("#ff9500")}</color><Icon><href>${PIN_HREF}</href></Icon></IconStyle></Style>` +
    (trackXml.length && wptXml.length ? folder("Tracks", trackXml) + folder("Waypoints", wptXml) : trackXml.join("") + wptXml.join("")) +
    "</Document></kml>";
  if (!tracks && !waypoints) throw new Error("No tracks, routes or waypoints found.");
  return { xml, tracks, waypoints };
}

      g.fillStyle = "#111";
      g.fillRect(9, 11, 16, 11);
      g.fillRect(13, 8, 6, 3);
      g.beginPath(); g.arc(17, 16.5, 3.6, 0, Math.PI * 2); g.fillStyle = "#fff"; g.fill();
    } else {
      g.beginPath(); g.arc(17, 16, 4.5, 0, Math.PI * 2); g.fillStyle = "rgba(255,255,255,.95)"; g.fill();
    }
    const url = c.toDataURL();
    iconCache.set(key, url);
    return url;
  }
  const pinScaleNF = new Cesium.NearFarScalar(3e3, 1.0, 4e5, 0.45);
  const labelFadeNF = new Cesium.NearFarScalar(1.5e5, 1.0, 7e5, 0.0);

  const heightCache = new Map();
  const pointInfo = new WeakMap(); // entity -> {lon, lat}
  let snapQueue = [];
  let snapTimer = null;
  let snapGen = 0;
  const hkey = (lon, lat) => lon.toFixed(6) + "," + lat.toFixed(6);
  function setPinHeight(ent, lon, lat, hgt) {
    ent.position = new Cesium.ConstantPositionProperty(Cesium.Cartesian3.fromDegrees(lon, lat, hgt + PIN_LIFT));
  }
  function queueSnap(ent, lon, lat) {
    const k = hkey(lon, lat);
    if (heightCache.has(k)) { setPinHeight(ent, lon, lat, heightCache.get(k)); return; }
    snapQueue.push({ ent, lon, lat, k });
    clearTimeout(snapTimer);
    snapTimer = setTimeout(flushSnap, 80);
  }
  async function flushSnap() {
    const batch = snapQueue;
    snapQueue = [];
    const gen = snapGen;
    const uniq = new Map();
    for (const b of batch) if (!uniq.has(b.k)) uniq.set(b.k, Cesium.Cartographic.fromDegrees(b.lon, b.lat));
    const keys = [...uniq.keys()];
    const cartos = [...uniq.values()];
    for (let i = 0; i < cartos.length; i += 3000) {
      try {
        await Cesium.sampleTerrainMostDetailed(viewer.terrainProvider, cartos.slice(i, i + 3000));
      } catch (e) {
        console.warn("Terrain sampling failed", e);
      }
    }
    if (gen !== snapGen) return;
    keys.forEach((k, i) => heightCache.set(k, Number.isFinite(cartos[i].height) ? cartos[i].height : 0));
    for (const b of batch) setPinHeight(b.ent, b.lon, b.lat, heightCache.get(b.k));
  }
  function resnapAll() {
    heightCache.clear();
    snapGen++;
    for (const d of docs) for (const src of docSources(d)) for (const e of src.entities.values) {
      const pi = pointInfo.get(e);
      if (pi) queueSnap(e, pi.lon, pi.lat);
    }
  }
  async function terrainHeightAt(lon, lat) {
    const k = hkey(lon, lat);
    if (heightCache.has(k)) return heightCache.get(k);
    const c = [Cesium.Cartographic.fromDegrees(lon, lat)];
    try { await Cesium.sampleTerrainMostDetailed(viewer.terrainProvider, c); } catch (e) { /* ignore */ }
    const hgt = Number.isFinite(c[0].height) ? c[0].height : 0;
    heightCache.set(k, hgt);
    return hgt;
  }

  /* ------------------------------------------------------------------
     Documents
     ------------------------------------------------------------------ */
  const docs = [];
  let myPlaces = null;
  let docSeq = 0;
  const pmEntities = new WeakMap(); // Placemark element -> Entity[]
  const entityRef = new WeakMap(); // Entity -> {doc, pm}
  const expanded = new WeakSet();

  const clusterImg = new Map();
  const pinBuilder = new Cesium.PinBuilder();
  function applyClustering(doc) {
    const cl = doc.dataSource.clustering;
    cl.enabled = settings.cluster;
    cl.pixelRange = 40;
    cl.minimumClusterSize = 3;
  }
  function wireClusterStyle(doc) {
    doc.dataSource.clustering.clusterEvent.addEventListener((clustered, cluster) => {
      const n = clustered.length;
      const key = n >= 100 ? "99+" : String(n);
      if (!clusterImg.has(key)) clusterImg.set(key, pinBuilder.fromText(key, Cesium.Color.fromCssColorString("#3d6fb6"), 42).toDataURL());
      cluster.label.show = false;
      cluster.billboard.show = true;
      cluster.billboard.id = cluster.label.id;
      cluster.billboard.verticalOrigin = Cesium.VerticalOrigin.BOTTOM;
      cluster.billboard.image = clusterImg.get(key);
    });
  }

  /* Pins marked "Always show" live in a second, never-clustered data source */
  const docSources = (doc) => (doc.pinnedDs ? [doc.dataSource, doc.pinnedDs] : [doc.dataSource]);
  function pinnedDs(doc) {
    if (!doc.pinnedDs) {
      doc.pinnedDs = new Cesium.CustomDataSource("pinned" + doc.id);
      viewer.dataSources.add(doc.pinnedDs);
      if (clean.on) doc.pinnedDs.show = false;
    }
    return doc.pinnedDs;
  }
  const isAlwaysShow = (pm) => getData(pm, "alwaysShow") === "1";

  function docName(doc) {
    return childText(doc.root, "name") || (doc.fileName || "Untitled").replace(/\.(kml|kmz)$/i, "");
  }
  function initExpanded(doc) {
    expanded.add(doc.root);
    for (const tag of CONTAINER_TAGS) {
      for (const el of doc.dom.getElementsByTagNameNS("*", tag)) if (childText(el, "open") === "1") expanded.add(el);
    }
  }
  function createDoc(xmlText, opts = {}) {
    const { dom, root } = parseKml(xmlText);
    const doc = {
      id: ++docSeq,
      dom,
      root,
      fileName: opts.fileName || "Untitled.kml",
      handle: opts.handle || null,
      kmz: opts.kmz || null,
      assets: new Map(opts.assets || []), // photos added in this app, path -> Blob
      _zip: null,
      dirty: !!opts.dirty,
      isMyPlaces: !!opts.isMyPlaces,
      _styleIndex: null,
      dataSource: new Cesium.CustomDataSource("doc" + docSeq),
    };
    viewer.dataSources.add(doc.dataSource);
    applyClustering(doc);
    wireClusterStyle(doc);
    if (doc.isMyPlaces) docs.unshift(doc);
    else docs.push(doc);
    initExpanded(doc);
    renderAll(doc);
    return doc;
  }
  /* ---------- Photos inside KMZ files ---------- */
  async function docZip(doc) {
    if (!doc.kmz) return null;
    if (!doc._zip) doc._zip = await (await getJSZip()).loadAsync(doc.kmz.bytes);
    return doc._zip;
  }
  async function assetBlob(doc, path) {
    let blob = doc.assets.get(path);
    if (!blob) {
      const zip = await docZip(doc);
      if (zip) {
        const dir = doc.kmz.entry.includes("/") ? doc.kmz.entry.slice(0, doc.kmz.entry.lastIndexOf("/") + 1) : "";
        let dec = path;
        try { dec = decodeURIComponent(path); } catch (e) { /* keep */ }
        const f = zip.file(dir + path) || zip.file(dir + dec) || zip.file(path) || zip.file(dec);
        if (f) blob = await f.async("blob");
      }
    }
    return blob || null;
  }
  const assetUrls = new Map();
  async function assetUrl(doc, path) {
    const key = doc.id + "|" + path;
    if (assetUrls.has(key)) return assetUrls.get(key);
    let blob = doc.assets.get(path);
    if (!blob) {
      const zip = await docZip(doc);
      if (zip) {
        const dir = doc.kmz.entry.includes("/") ? doc.kmz.entry.slice(0, doc.kmz.entry.lastIndexOf("/") + 1) : "";
        let dec = path;
        try { dec = decodeURIComponent(path); } catch (e) { /* keep */ }
        const f = zip.file(dir + path) || zip.file(dir + dec) || zip.file(path) || zip.file(dec);
        if (f) blob = await f.async("blob");
      }
    }
    if (!blob) return null;
    const url = URL.createObjectURL(blob);
    assetUrls.set(key, url);
    return url;
  }
  /** Swap relative <img src> paths for viewable URLs */
  async function resolveHtmlImages(doc, html) {
    const srcs = [...html.matchAll(/(<img[^>]*src=["'])((?!https?:|data:|blob:)[^"']+)(["'])/gi)].map((m) => m[2]);
    for (const src of new Set(srcs)) {
      const url = await assetUrl(doc, src);
      if (url) html = html.split(`"${src}"`).join(`"${url}"`).split(`'${src}'`).join(`'${url}'`);
    }
    return html;
  }
  async function resizePhoto(file, maxSide) {
    if (!maxSide) return file;
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    if (k >= 1 && /jpe?g/i.test(file.type)) return file;
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k);
    c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise((res) => c.toBlob(res, "image/jpeg", 0.88));
  }
  function uniqueAssetPath(doc, fileName) {
    const base = fileName.replace(/\.[^.]+$/, "").replace(/[^\w\-]+/g, "_").slice(0, 60) || "photo";
    let path = `files/${base}.jpg`;
    for (let i = 2; doc.assets.has(path) || serializeKml(doc.dom).includes(`"${path}"`); i++) path = `files/${base}_${i}.jpg`;
    return path;
  }
  /** Image files on a paste event's clipboard (screenshots, "Copy image", files copied in Explorer) */
  const clipboardImages = (dt) =>
    dt && dt.items ? [...dt.items].filter((i) => i.kind === "file" && /^image\//.test(i.type)).map((i) => i.getAsFile()).filter(Boolean) : [];
  /** Clipboard images have generic names ("image.png") — give them a dated one */
  function photoName(f) {
    if (f.name && !/^image\.\w+$/i.test(f.name)) return f.name;
    const d = new Date(), p2 = (n) => String(n).padStart(2, "0");
    return `pasted_${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}`;
  }
  /** Resize + store photos in the doc's KMZ assets; returns description HTML with them appended */
  async function appendPhotos(doc, desc, files, full) {
    let d = desc || "";
    if (d.trim() && !/<[a-z][\s\S]*>/i.test(d)) d = escapeHtml(d).replace(/\n/g, "<br>\n");
    let added = 0;
    for (const f of files) {
      try {
        const blob = await resizePhoto(f, full ? 0 : 2400);
        const path = uniqueAssetPath(doc, photoName(f));
        doc.assets.set(path, blob);
        d += (d.trim() ? "\n" : "") + `<img src="${path}" width="480"><br>`;
        added++;
      } catch (e) {
        toast(`Couldn't read ${f.name || "image"}`);
      }
    }
    return { desc: d, added };
  }

  function renderAll(doc) {
    const ents = doc.dataSource.entities;
    ents.suspendEvents();
    renderSubtree(doc, doc.root);
    ents.resumeEvents();
  }
  const pathOf = (root, el) => {
    const p = [];
    for (let n = el; n && n !== root; n = n.parentElement) p.unshift(childEls(n.parentElement, FEATURE_TAGS).indexOf(n));
    return p;
  };
  const byPath = (root, p) => {
    let n = root;
    for (const i of p) { n = childEls(n, FEATURE_TAGS)[i]; if (!n) return null; }
    return n;
  };
  function reloadDoc(doc, xml) {
    if (doc.pinnedDs) doc.pinnedDs.entities.removeAll();
    const openPaths = [];
    for (const tag of CONTAINER_TAGS) {
      for (const el of doc.root.getElementsByTagNameNS("*", tag)) if (expanded.has(el)) openPaths.push(pathOf(doc.root, el));

    doc.dataSource.entities.removeAll();
    const { dom, root } = parseKml(xml);
    doc.dom = dom;
    doc.root = root;
    doc._styleIndex = null;
    initExpanded(doc);
    for (const p of openPaths) { const el = byPath(root, p); if (el && isContainer(el)) expanded.add(el); }
    renderAll(doc);
  }

  /* ------------------------------------------------------------------
     Rendering placemarks into Cesium entities
     ------------------------------------------------------------------ */
  function renderSubtree(doc, el) {
    if (el.localName === "Placemark") renderPlacemark(doc, el);
    else if (isContainer(el)) for (const c of childEls(el, FEATURE_TAGS)) renderSubtree(doc, c);
  }
  function unrenderSubtree(doc, el) {
    for (const pm of placemarksIn(el)) {
      const ents = pmEntities.get(pm);
      if (ents) for (const e of ents) { if (!doc.dataSource.entities.remove(e) && doc.pinnedDs) doc.pinnedDs.entities.remove(e); }
      pmEntities.delete(pm);
    }
  }

    unrenderSubtree(doc, pm);
    renderPlacemark(doc, pm);
  }

  function renderPlacemark(doc, pm) {
    const st = resolveStyle(doc, pm);
    const name = childText(pm, "name");
    const show = isEffectivelyVisible(pm);
    const isView = !!childEl(pm, "Camera");
    const always = isAlwaysShow(pm);
    const ds = always ? pinnedDs(doc).entities : doc.dataSource.entities;
    const ents = [];
    const lineColor = kmlColor(st.lineColor, Cesium.Color.WHITE);
    const width = Math.max(2, st.lineWidth || 2);
    const pos = (coords) => Cesium.Cartesian3.fromDegreesArray(coords.flat());

    for (const g of collectGeoms(pm)) {
      if (g.type === "point") {
        const [lon, lat] = g.coords[0];
        const cached = heightCache.get(hkey(lon, lat));
        const labelColor = kmlColor(st.labelColor, Cesium.Color.WHITE);
        const e = ds.add({
          name,
          show,
          position: Cesium.Cartesian3.fromDegrees(lon, lat, (cached ?? 0) + PIN_LIFT),
          billboard: {
            image: pinIcon(isView ? "#2f80ff" : pinCss(st), isView ? "view" : "pin"),
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            scale: settings.pinScale,
            scaleByDistance: pinScaleNF,
          },
          label: {
            text: name,
            show: !!name && (always || settings.labels),
            font: "600 13px system-ui, sans-serif",
            fillColor: labelColor.alpha > 0.05 ? labelColor : Cesium.Color.WHITE,
            outlineColor: Cesium.Color.BLACK,
            outlineWidth: 3,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            horizontalOrigin: Cesium.HorizontalOrigin.LEFT,
            verticalOrigin: Cesium.VerticalOrigin.CENTER,
            pixelOffset: new Cesium.Cartesian2(14 * settings.pinScale, -30 * settings.pinScale),
            pixelOffsetScaleByDistance: pinScaleNF,
            translucencyByDistance: always ? undefined : labelFadeNF,
          },
        });
        pointInfo.set(e, { lon, lat });
        if (cached === undefined) queueSnap(e, lon, lat);
        ents.push(e);
      } else if (g.type === "line") {
        if (g.coords.length < 2) continue;
        ents.push(ds.add({ name, show, polyline: { positions: pos(g.coords), clampToGround: true, width, material: lineColor } }));
      } else if (g.type === "polygon") {
        if (g.outer.length < 3) continue;
        const fill = kmlColor(st.polyColor, Cesium.Color.WHITE);
        if (st.polyFill && fill.alpha > 0.01) {
          ents.push(ds.add({
            name,
            show,
            polygon: {
              hierarchy: new Cesium.PolygonHierarchy(
                pos(g.outer),
                g.holes.filter((hh) => hh.length >= 3).map((hh) => new Cesium.PolygonHierarchy(pos(hh)))
              ),
              material: fill,
              classificationType: Cesium.ClassificationType.TERRAIN,
            },
          }));
        }
        if (st.polyOutline && lineColor.alpha > 0.01) {
          ents.push(ds.add({ name, show, polyline: { positions: pos(closeRing(g.outer)), clampToGround: true, width, material: lineColor } }));
        }

    pmEntities.set(pm, ents);
  }
  function updateVisibility(doc, el) {
    for (const pm of placemarksIn(el)) {
      const vis = isEffectivelyVisible(pm);
      for (const e of pmEntities.get(pm) || []) e.show = vis;
    }
  }
  function forEachEntity(fn) {
    for (const d of docs) for (const src of docSources(d)) for (const e of src.entities.values) fn(e, d);
  }

  /* ------------------------------------------------------------------
     Undo / redo (snapshots of the affected files)
     ------------------------------------------------------------------ */
  const undoStack = [];
  const redoStack = [];
  function capture(docList, label) {
    return { label, items: docList.map((d) => ({ doc: d, xml: serializeKml(d.dom) })) };
  }
  function snapshot(docList, label) {
    const entry = capture(docList, label);
    undoStack.push(entry);
    if (undoStack.length > 40) undoStack.shift();
    redoStack.length = 0;
    return entry;
  }
  function applyEntry(entry) {
    for (const it of entry.items) {
      if (!docs.includes(it.doc)) continue;
      reloadDoc(it.doc, it.xml);
      markDirty(it.doc, false);
    }
    selected = null;
    viewer.selectedEntity = undefined;
    renderTree();
    scheduleAutosave();
  }
  function undo() {
    const entry = undoStack.pop();
    if (!entry) return toast("Nothing to undo");
    redoStack.push(capture(entry.items.map((i) => i.doc), entry.label));
    applyEntry(entry);
    toast("Undo: " + entry.label);
  }
  function redo() {
    const entry = redoStack.pop();
    if (!entry) return toast("Nothing to redo");
    undoStack.push(capture(entry.items.map((i) => i.doc), entry.label));
    applyEntry(entry);
    toast("Redo: " + entry.label);
  }
  function markDirty(doc, rerender = true) {
    doc.dirty = true;
    scheduleAutosave();
    if (rerender) renderTree();
  }

  /* ------------------------------------------------------------------
     Session autosave (browser storage) — survives page reloads
     ------------------------------------------------------------------ */
  let autosaveTimer = null;
  let autosaveWarned = false;
  function scheduleAutosave() {
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(autosaveNow, 1200);
  }
  async function autosaveNow() {
    const pack = (withHandles) =>
      docs.map((d) => ({
        fileName: d.fileName,
        xml: serializeKml(d.dom),
        dirty: d.dirty,
        isMyPlaces: d.isMyPlaces,
        kmz: d.kmz ? { bytes: d.kmz.bytes, entry: d.kmz.entry } : null,
        assets: [...d.assets],
        handle: withHandles ? d.handle : null,
      }));
    try {
      try {
        await idb.set("session", pack(true));
      } catch (e) {
        await idb.set("session", pack(false)); // file handles not storable here
      }
    } catch (e) {
      if (!autosaveWarned) {
        autosaveWarned = true;
        toast("Autosave isn't available in this frame — use Save, or open Sandcastle's Standalone view.", 5000);
      }
    }
  }

  /* ------------------------------------------------------------------
     File menu: New / Open / Save / Save As / Close
     ------------------------------------------------------------------ */
  const KMZ_TYPE = { description: "KMZ file", accept: { "application/vnd.google-earth.kmz": [".kmz"] } };

  async function newDocument() {
    const name = await askText("New Document", "Document name", "Untitled");
    if (name === null) return;
    const doc = createDoc(newKmlText(name || "Untitled"), { fileName: (name || "Untitled") + ".kmz", dirty: true });
    selected = { doc, el: doc.root };
    renderTree();
    scheduleAutosave();
  }

  async function openDialog() {
    if (window.showOpenFilePicker) {
      try {
        const handles = await window.showOpenFilePicker({
          multiple: true,
          types: [{ description: "Google Earth / GPS files", accept: { "application/vnd.google-earth.kml+xml": [".kml"], "application/vnd.google-earth.kmz": [".kmz"], "application/gpx+xml": [".gpx"] } }],
        });
        for (const hd of handles) await openFile(await hd.getFile(), hd);
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return;
        // Not allowed in this frame — fall back to a normal file input
      }
    }
    const input = h("input", { type: "file", accept: ".kml,.kmz,.gpx", multiple: true });
    input.onchange = async () => { for (const f of input.files) await openFile(f, null); };
    input.click();
  }

  async function openFile(file, handle) {
    try {
      let xml;
      let kmz = null;
      if (/\.gpx$/i.test(file.name)) {
        const base = file.name.replace(/\.gpx$/i, "");
        const res = gpxToKml(await file.text(), base);
        const doc = createDoc(res.xml, { fileName: base + ".kmz", dirty: true });
        selected = { doc, el: doc.root };
        renderTree();
        scheduleAutosave();
        toast(`Imported ${file.name}: ${res.tracks} track${res.tracks === 1 ? "" : "s"}, ${res.waypoints} waypoint${res.waypoints === 1 ? "" : "s"} — Save to keep it`, 5000);
        setTimeout(() => flyToFeature(doc, doc.root), 300);
        return;
      }
      if (/\.kmz$/i.test(file.name)) {
        const bytes = await file.arrayBuffer();
        const JSZip = await getJSZip();
        const zip = await JSZip.loadAsync(bytes);
        const names = Object.keys(zip.files).filter((n) => !zip.files[n].dir);
        const entry = names.find((n) => n.toLowerCase() === "doc.kml") || names.find((n) => /\.kml$/i.test(n));
        if (!entry) throw new Error("No KML found inside this KMZ.");
        xml = await zip.file(entry).async("string");
        kmz = { bytes, entry };
      } else {
        xml = await file.text();
      }
      const doc = createDoc(xml, { fileName: file.name, handle, kmz });
      selected = { doc, el: doc.root };
      renderTree();
      scheduleAutosave();
      const n = doc.root.getElementsByTagNameNS("*", "Placemark").length;
      toast(`Opened ${file.name} — ${n.toLocaleString()} placemarks`);
      setTimeout(() => flyToFeature(doc, doc.root), 300);
    } catch (e) {
      console.error(e);
      toast(`Couldn't open ${file.name}: ${e.message}`, 5000);
    }
  }

  /** Everything saves as KMZ (zipped KML — opens normally in Google Earth and can hold photos) */
  async function buildBlob(doc) {
    const xml = serializeKml(doc.dom);
    const JSZip = await getJSZip();
    const zip = doc.kmz ? await JSZip.loadAsync(doc.kmz.bytes) : new JSZip();
    const entry = doc.kmz ? doc.kmz.entry : "doc.kml";
    zip.file(entry, xml);
    const dir = entry.includes("/") ? entry.slice(0, entry.lastIndexOf("/") + 1) : "";
    for (const [path, blob] of doc.assets) if (xml.includes(path)) zip.file(dir + path, blob);
    return zip.generateAsync({ type: "blob", compression: "DEFLATE", mimeType: "application/vnd.google-earth.kmz" });
  }
  async function writeHandle(handle, blob) {
    if (handle.queryPermission && (await handle.queryPermission({ mode: "readwrite" })) !== "granted") {
      if ((await handle.requestPermission({ mode: "readwrite" })) !== "granted") throw new Error("Permission denied");
    }
    const w = await handle.createWritable();
    await w.write(blob);
    await w.close();
  }
  async function afterSaved(doc, fileName, blob) {
    doc.fileName = fileName;
    doc.kmz = { bytes: await blob.arrayBuffer(), entry: doc.kmz ? doc.kmz.entry : "doc.kml" };
    doc.assets.clear(); // now stored inside the KMZ
    doc._zip = null;
    doc.dirty = false;
    renderTree();
    scheduleAutosave();
  }
  const kmzName = (doc) => (doc.fileName || docName(doc)).replace(/\.(kml|kmz|gpx)$/i, "") + ".kmz";

  async function saveDoc(doc) {
    if (!doc) return;
    if (doc.handle && /\.kmz$/i.test(doc.handle.name)) {
      try {
        const blob = await buildBlob(doc);
        await writeHandle(doc.handle, blob);
        await afterSaved(doc, doc.handle.name, blob);
        toast("Saved " + doc.fileName);
        return true;
      } catch (e) {
        console.warn(e);
      }
    }
    return saveDocAs(doc); // first save of a .kml / .gpx / new file picks a .kmz name
  }

  async function saveDocAs(doc) {
    if (!doc) return;
    const suggested = kmzName(doc);
    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({ suggestedName: suggested, types: [KMZ_TYPE] });
        const blob = await buildBlob(doc);
        await writeHandle(handle, blob);
        doc.handle = handle;
        await afterSaved(doc, handle.name, blob);
        toast("Saved " + handle.name);
        return true;
      } catch (e) {
        if (e && e.name === "AbortError") return false;
        // Picker blocked (embedded frame) — fall back to a download
      }
    }
    const nameIn = h("input", { type: "text", value: suggested.replace(/\.kmz$/i, "") });
    return new Promise((resolve) => {
      showDialog({
        title: "Save As",
        body: h("div", {},
          h("label", {}, "File name (.kmz)", nameIn),
          h("div", { class: "ts-hint", style: { marginTop: "8px" } },
            "This browser frame can't write files directly, so the KMZ will download. ",
            "(Sandcastle's Standalone view saves in place.)")
        ),
        buttons: [
          { label: "Download", primary: true, skipOnClose: true, action: async () => {
            const fileName = (nameIn.value.trim() || suggested).replace(/\.(kml|kmz)$/i, "") + ".kmz";
            const blob = await buildBlob(doc);
            downloadBlob(blob, fileName);
            doc.handle = null;
            await afterSaved(doc, fileName, blob);
            toast("Downloaded " + fileName);
            resolve(true);
          } },
          { label: "Cancel", skipOnClose: true, action: () => resolve(false) },
        ],
        onClose: () => resolve(false),
      });
    });
  }

  async function closeDoc(doc) {
    if (!doc || doc.isMyPlaces) return;
    if (doc.dirty) {
      const choice = await askChoice("Unsaved changes", `Save changes to "${docName(doc)}" before closing?`, [
        { label: "Save", primary: true, value: "save" },
        { label: "Don't Save", danger: true, value: "discard" },
        { label: "Cancel", value: null },
      ]);
      if (!choice) return;
      if (choice === "save" && !(await saveDoc(doc))) return;
    }
    viewer.dataSources.remove(doc.dataSource, true);
    if (doc.pinnedDs) viewer.dataSources.remove(doc.pinnedDs, true);
    docs.splice(docs.indexOf(doc), 1);
    if (selected && selected.doc === doc) selected = null;
    for (const stack of [undoStack, redoStack]) {
      for (let i = stack.length - 1; i >= 0; i--) if (stack[i].items.some((it) => it.doc === doc)) stack.splice(i, 1);
    }
    renderTree();
    scheduleAutosave();
  }
  const activeDoc = () => (selected && docs.includes(selected.doc) ? selected.doc : myPlaces || docs[0] || null);

  /* ------------------------------------------------------------------
     Places tree (Google Earth style)
     ------------------------------------------------------------------ */
  let selected = null; // {doc, el} — the primary (last clicked) item
  // Multi-select (Shift+click range, Ctrl+click toggle): extra items in the same file as `selected`
  let multi = new Set();
  let anchor = null; // where a Shift+click range starts
  let rowOrder = []; // [{doc, el}] in on-screen order, rebuilt by renderTree
  let rowOf = new WeakMap();
  let drag = null;
  let filterText = "";

  const defaultName = (el) =>
    ({ Folder: "Untitled Folder", Document: "Untitled", Placemark: "" }[el.localName] ?? el.localName);

  function nodeIcon(doc, el) {
    if (el === doc.root) return h("span", { class: "ts-icon" }, doc.isMyPlaces ? "⭐" : "🗂️");
    if (isContainer(el)) return h("span", { class: "ts-icon" }, "📁");
    if (el.localName !== "Placemark") return h("span", { class: "ts-icon", title: "Not displayed in this viewer (kept in the file)" }, "🖼️");
    if (childEl(el, "Camera")) return h("span", { class: "ts-icon" }, "📷");
    const kind = geomKind(el);
    const st = resolveStyle(doc, el);
    if (kind === "point") return h("span", { class: "ts-icon", style: { color: pinCss(st) } }, "●");
    if (kind === "line") return h("span", { class: "ts-icon", style: { color: lineCss(st) } }, "〰");
    if (kind === "polygon") return h("span", { class: "ts-icon", style: { color: lineCss(st) } }, "⬟");
    return h("span", { class: "ts-icon" }, "◆");
  }

  /** The items an action applies to: the multi-selection (outermost items only, file order) or just the primary */
  function selectionList() {
    if (!selected || !docs.includes(selected.doc) || !selected.el.isConnected) return [];
    const doc = selected.doc;
    const set = new Set([...multi].filter((el) => el.isConnected && el !== doc.root && doc.root.contains(el)));
    if (set.size < 2) return selected.el === doc.root ? [] : [selected.el];
    const out = [];
    for (const el of doc.root.getElementsByTagNameNS("*", "*")) {
      if (!set.has(el)) continue;
      let covered = false;
      for (let p = el.parentElement; p && p !== doc.root; p = p.parentElement) if (set.has(p)) { covered = true; break; }
      if (!covered) out.push(el);
    }
    return out;
  }
  const multiActive = () => selectionList().length > 1;
  function refreshSelectionClasses() {
    for (const { el } of rowOrder) {
      const row = rowOf.get(el);
      if (row) row.classList.toggle("selected", (selected && selected.el === el) || multi.has(el));
    }
  }
  function clearMulti() {
    if (!multi.size) return;
    multi.clear();
    refreshSelectionClasses();
  }
  /** Click on a list row: plain = single, Shift = range from the anchor, Ctrl = add / remove one */
  function rowClick(e, doc, el) {
    const sameDoc = selected && selected.doc === doc && docs.includes(doc);
    if (e.shiftKey && sameDoc && anchor) {
      const ia = rowOrder.findIndex((r) => r.el === anchor), ib = rowOrder.findIndex((r) => r.el === el);
      if (ia >= 0 && ib >= 0) {
        multi = new Set(rowOrder.slice(Math.min(ia, ib), Math.max(ia, ib) + 1).filter((r) => r.doc === doc && r.el !== doc.root).map((r) => r.el));
        selectEl(doc, el, { keepMulti: true });
        return;
      }
    }
    if ((e.ctrlKey || e.metaKey) && sameDoc && el !== doc.root) {
      if (!multi.size && selected.el !== doc.root) multi.add(selected.el);
      if (multi.has(el)) {
        multi.delete(el);
        const next = [...multi].pop();
        if (next) { anchor = el; selectEl(doc, next, { keepMulti: true }); return; }
      } else multi.add(el);
      anchor = el;
      selectEl(doc, el, { keepMulti: true });
      return;
    }
    selectEl(doc, el);
  }

  function renderTree() {
    const tree = ui.tree;
    const scroll = tree.scrollTop;
    tree.textContent = "";
    rowOf = new WeakMap();
    rowOrder = [];
    if (filterText) {
      renderFilterResults(tree);
    } else {
      const memo = new Map();
      for (const d of docs) renderNode(d, d.root, 0, tree, memo);
      if (docs.length === 1 && !childEls(myPlaces.root, FEATURE_TAGS).length) {
        tree.appendChild(h("div", { class: "ts-empty" },
          "Open a KML/KMZ/GPX (File → Open, or drop it on the map), or add a placemark with the 📍 button. Right-click anything for options; drag to reorganize."));
      }
    }
    tree.scrollTop = scroll;
    updateTitle();
  }

  function visState(el, memo) {
    if (memo.has(el)) return memo.get(el);
    let s;
    if (!ownVisible(el)) s = 0;
    else if (!isContainer(el)) s = 1;
    else {
      const kids = childEls(el, FEATURE_TAGS);
      if (!kids.length) s = 1;
      else {
        let on = 0, off = 0, mixed = false;
        for (const k of kids) {
          const v = visState(k, memo);
          if (v === 1) on++; else if (v === 0) off++; else mixed = true;
        }
        s = mixed || (on && off) ? 0.5 : off && !on ? 0 : 1;
      }
    }
    memo.set(el, s);
    return s;
  }

  function renderNode(doc, el, depth, tree, memo) {
    const isRoot = el === doc.root;
    const cont = isContainer(el);
    const kids = cont ? childEls(el, FEATURE_TAGS) : [];
    const open = expanded.has(el);
    const row = h("div", { class: "ts-row" + (isRoot ? " docrow" : "") + ((selected && selected.el === el) || multi.has(el) ? " selected" : "") });
    row.style.paddingLeft = 4 + depth * 16 + "px";

    const caret = h("span", { class: "ts-caret" }, kids.length ? (open ? "▼" : "▶") : "");
    caret.addEventListener("click", (e) => { e.stopPropagation(); toggleExpand(el); });
    const cb = h("input", { type: "checkbox", title: "Show / hide" });
    const vs = visState(el, memo);
    cb.checked = vs > 0;
    cb.indeterminate = vs === 0.5;
    cb.addEventListener("click", (e) => {
      e.stopPropagation();
      const list = multi.has(el) && multiActive() ? selectionList() : [el]; // ticking a selected row applies to the whole selection
      setVisibility(doc, list, cb.checked);
    });
    cb.addEventListener("dblclick", (e) => e.stopPropagation());

    const supported = cont || el.localName === "Placemark";
    const name = isRoot ? docName(doc) : childText(el, "name") || defaultName(el);
    const nameSpan = h("span", { class: "ts-name" + (supported ? "" : " unsupported"), title: name }, name);
    row.append(caret, cb, nodeIcon(doc, el), nameSpan);
    if (el.localName === "Placemark" && /<img\b/i.test(childText(el, "description"))) row.append(h("span", { title: "Has photos", style: { marginLeft: "5px", opacity: 0.8 } }, "🖼"));
    if (el.localName === "Placemark" && getData(el, "shortcut")) row.append(h("span", { class: "ts-keybadge", title: "Keyboard shortcut" }, getData(el, "shortcut")));
    if (isRoot && doc.dirty) row.append(h("span", { class: "ts-dirty", title: "Unsaved changes" }, "●"));

    row.addEventListener("mousedown", (e) => { if (e.shiftKey) e.preventDefault(); }); // no text selection on Shift+click
    row.addEventListener("click", (e) => rowClick(e, doc, el));
    row.addEventListener("dblclick", (e) => { if (!e.shiftKey && !e.ctrlKey && !e.metaKey) flyToFeature(doc, el); });
    row.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      if (multi.has(el) && multiActive()) { showDropdown(safeMenu(() => multiMenu()), e.clientX, e.clientY); return; }
      selectEl(doc, el);
      showDropdown(safeMenu(() => rowMenu(doc, el)), e.clientX, e.clientY);
    });

    // Drag & drop
    row.draggable = !isRoot;
    row.addEventListener("dragstart", (e) => {
      drag = { doc, el, els: multi.has(el) && multiActive() ? selectionList() : [el] };
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", "ts-node");
      setTimeout(() => (row.style.opacity = "0.45"), 0);
    });
    row.addEventListener("dragend", () => { drag = null; row.style.opacity = ""; });
    row.addEventListener("dragover", (e) => {
      const zone = dropZone(e, row, doc, el);
      if (!zone) return;
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = "move";
      row.classList.remove("drop-before", "drop-after", "drop-inside");
      row.classList.add("drop-" + zone);
    });
    row.addEventListener("dragleave", () => row.classList.remove("drop-before", "drop-after", "drop-inside"));
    row.addEventListener("drop", (e) => {
      const zone = dropZone(e, row, doc, el);
      row.classList.remove("drop-before", "drop-after", "drop-inside");
      if (!zone) return;
      e.preventDefault();
      e.stopPropagation();
      const src = drag;
      drag = null;
      if (src.els.length > 1) moveNodes(src.doc, src.els, doc, el, zone);
      else moveNode(src.doc, src.el, doc, el, zone);
    });

    tree.appendChild(row);
    rowOf.set(el, row);
    rowOrder.push({ doc, el });
    if (open) for (const k of kids) renderNode(doc, k, depth + 1, tree, memo);
  }

  function dropZone(e, row, doc, target) {
    if (!drag) return null;
    if (drag.els.some((d) => d === target || d.contains(target))) return null;
    if (target === doc.root) return "inside";
    const r = row.getBoundingClientRect();
    const y = (e.clientY - r.top) / r.height;
    if (isContainer(target)) return y < 0.28 ? "before" : y > 0.72 ? "after" : "inside";
    return y < 0.5 ? "before" : "after";
  }

  function renderFilterResults(tree) {
    const q = filterText.toLowerCase();
    let count = 0;
    for (const d of docs) {
      for (const tag of ["Folder", "Placemark"]) {
        for (const el of d.root.getElementsByTagNameNS("*", tag)) {
          const name = childText(el, "name");
          if (!name.toLowerCase().includes(q)) continue;
          if (++count > 400) break;
          const path = [];
          for (let p = el.parentElement; p && isFeature(p); p = p.parentElement) {
            path.unshift(p === d.root ? docName(d) : childText(p, "name") || defaultName(p));
          }
          const res = h("div", { class: "ts-result" + ((selected && selected.el === el) || multi.has(el) ? " selected" : "") },
            h("span", {}, nodeIcon(d, el), " ", name), h("small", {}, path.join(" › ")));
          res.addEventListener("mousedown", (e) => { if (e.shiftKey) e.preventDefault(); });
          res.addEventListener("click", (e) => {
            if (e.shiftKey || e.ctrlKey || e.metaKey) return rowClick(e, d, el);
            selectEl(d, el); flyToFeature(d, el);
          });
          res.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            if (multi.has(el) && multiActive()) { showDropdown(safeMenu(() => multiMenu()), e.clientX, e.clientY); return; }
            selectEl(d, el); showDropdown(safeMenu(() => rowMenu(d, el)), e.clientX, e.clientY);
          });
          tree.appendChild(res);
          rowOf.set(el, res);
          rowOrder.push({ doc: d, el });
        }
      }
    }
    if (!count) tree.appendChild(h("div", { class: "ts-empty" }, "No matches."));
  }

  function toggleExpand(el, force) {
    const open = force !== undefined ? force : !expanded.has(el);
    if (open) expanded.add(el); else expanded.delete(el);
    renderTree();
  }
  function revealInTree(doc, el) {
    if (filterText) { filterText = ""; ui.filter.value = ""; }
    for (let p = el.parentElement; p && isFeature(p); p = p.parentElement) expanded.add(p);
    renderTree();
    const row = rowOf.get(el);
    if (row) row.scrollIntoView({ block: "nearest" });
  }

  let syncingSelection = false;
  function selectEl(doc, el, { keepMulti = false } = {}) {
    if (!keepMulti) { multi.clear(); anchor = el; }
    selected = { doc, el };
    refreshSelectionClasses();
    const row = rowOf.get(el);
    if (row) row.classList.add("selected");
    syncingSelection = true;
    const ents = el.localName === "Placemark" ? pmEntities.get(el) || [] : [];
    viewer.selectedEntity = ents.find((e) => pointInfo.has(e)) || ents[0] || undefined;
    syncingSelection = false;
  }

  function setVisibility(doc, els, on) {
    const apply = (n) => {
      setChildText(n, "visibility", on ? "1" : "0");
      if (isContainer(n)) for (const k of childEls(n, FEATURE_TAGS)) apply(k);
    };
    for (const el of Array.isArray(els) ? els : [els]) {
      apply(el);
      if (on) for (let p = el.parentElement; p && isFeature(p); p = p.parentElement) setChildText(p, "visibility", "1");
    }
    updateVisibility(doc, doc.root);
    renderTree();
    scheduleAutosave();
  }

  /* ---------------- Editing operations ---------------- */
  function targetContainer() {
    if (selected) {
      if (isContainer(selected.el)) return { doc: selected.doc, el: selected.el };
      const p = selected.el.parentElement;
      if (p && isContainer(p)) return { doc: selected.doc, el: p };
    }
    return { doc: myPlaces, el: myPlaces.root };
  }
  function addFeature(target, feat, label) {
    const entry = snapshot([target.doc], label);
    target.el.appendChild(feat);
    target.doc._styleIndex = null;
    target.doc.dataSource.entities.suspendEvents();
    renderSubtree(target.doc, feat);
    target.doc.dataSource.entities.resumeEvents();
    expanded.add(target.el);
    markDirty(target.doc, false);
    revealInTree(target.doc, feat);
    selectEl(target.doc, feat);
    return entry;
  }
  function makePlacemark(ref, name, lon, lat) {
    const pm = newEl(ref, "Placemark");
    setChildText(pm, "name", name);
    const pt = newEl(ref, "Point");
    addTextChild(pt, "altitudeMode", "clampToGround");
    addTextChild(pt, "coordinates", `${lon.toFixed(7)},${lat.toFixed(7)},0`);
    pm.appendChild(pt);
    return pm;
  }
  function makeLinePlacemark(ref, name, coords, css, width) {
    const pm = newEl(ref, "Placemark");
    setChildText(pm, "name", name);
    setLineStyle(pm, css, width);
    const ls = newEl(ref, "LineString");
    addTextChild(ls, "tessellate", "1");
    addTextChild(ls, "altitudeMode", "clampToGround");
    addTextChild(ls, "coordinates", coords.map(([lo, la]) => `${lo.toFixed(7)},${la.toFixed(7)},0`).join(" "));
    pm.appendChild(ls);
    return pm;
  }

  function newFolder() {
    const t = targetContainer();
    const f = newEl(t.doc.dom, "Folder");
    setChildText(f, "name", "New Folder");
    addFeature(t, f, "New folder");
    startRename(t.doc, f);
  }

  function addPlacemarkAt(lon, lat, target = targetContainer()) {
    const pm = makePlacemark(target.doc.dom, "", lon, lat);
    setPinColor(pm, PIN_COLORS.Yellow);
    const entry = addFeature(target, pm, "Add placemark");
    openProperties(target.doc, pm, { isNew: true, entry });
  }

  async function addViewpoint() {
    const t = targetContainer();
    const c = camera.positionCartographic;
    const lon = Cesium.Math.toDegrees(c.longitude), lat = Cesium.Math.toDegrees(c.latitude);
    const n = t.doc.root.getElementsByTagNameNS("*", "Camera").length + 1;
    const pm = makePlacemark(t.doc.dom, `Viewpoint ${n}`, lon, lat);
    setPinColor(pm, "#2f80ff", CAMERA_HREF);
    writeCamera(pm);
    const entry = addFeature(t, pm, "Add viewpoint");
    openProperties(t.doc, pm, { isNew: true, entry });
  }
  function writeCamera(pm) {
    const c = camera.positionCartographic;
    removeChildren(pm, ["Camera", "LookAt"]);
    const cam = newEl(pm, "Camera");
    addTextChild(cam, "longitude", Cesium.Math.toDegrees(c.longitude).toFixed(7));
    addTextChild(cam, "latitude", Cesium.Math.toDegrees(c.latitude).toFixed(7));
    addTextChild(cam, "altitude", c.height.toFixed(2));
    addTextChild(cam, "heading", Cesium.Math.toDegrees(camera.heading).toFixed(2));
    addTextChild(cam, "tilt", (Cesium.Math.toDegrees(camera.pitch) + 90).toFixed(2));
    addTextChild(cam, "roll", "0");
    addTextChild(cam, "altitudeMode", "absolute");
    insertOrdered(pm, cam);
    const lens = settings.lens;
    setData(pm, "focalLength", lens.on ? lens.focal : 0);
    setData(pm, "sensor", lens.sensor);
    setData(pm, "frameAspect", lens.aspect);
    setData(pm, "frameOrientation", lens.orient);
  }

  function startRename(doc, el) {
    revealInTree(doc, el);
    const row = rowOf.get(el);
    if (!row) return;
    row.draggable = false;
    const nameSpan = row.querySelector(".ts-name");
    const current = el === doc.root ? docName(doc) : childText(el, "name");
    const input = h("input", { class: "ts-rename", type: "text", value: current });
    nameSpan.replaceWith(input);
    input.focus();
    input.select();
    let done = false;
    const finish = (commit) => {
      if (done) return;
      done = true;
      const v = input.value.trim();
      if (commit && v && v !== current) {
        snapshot([doc], "Rename");
        setChildText(el, "name", v);
        for (const pm of el.localName === "Placemark" ? [el] : []) {
          for (const e of pmEntities.get(pm) || []) {
            e.name = v;
            if (e.label) { e.label.text = v; e.label.show = settings.labels || isAlwaysShow(pm); }
          }
        }
        markDirty(doc);
      } else renderTree();
    };
    input.addEventListener("keydown", (e) => {
      e.stopPropagation();
      if (e.key === "Enter") finish(true);
      if (e.key === "Escape") finish(false);
    });
    input.addEventListener("blur", () => finish(true));
    for (const ev of ["click", "dblclick", "mousedown"]) input.addEventListener(ev, (e) => e.stopPropagation());
  }

  async function deleteNode(doc, el) {
    if (el === doc.root) return closeDoc(doc);
    const name = childText(el, "name") || defaultName(el);
    if (isContainer(el) && childEls(el, FEATURE_TAGS).length) {
      const n = el.getElementsByTagNameNS("*", "Placemark").length;
      const ok = await askChoice("Delete folder", `Delete "${name}" and everything in it (${n.toLocaleString()} placemarks)?`, [
        { label: "Delete", danger: true, value: true },
        { label: "Cancel", value: false },
      ]);
      if (!ok) return;
    }
    snapshot([doc], "Delete");
    unrenderSubtree(doc, el);
    el.remove();
    doc._styleIndex = null;
    selected = null;
    viewer.selectedEntity = undefined;
    markDirty(doc);
    toast(`Deleted "${name}" — Ctrl+Z to undo`);
  }

  function moveNode(srcDoc, el, dstDoc, target, zone) {
    const parent = zone === "inside" ? target : target.parentElement;
    if (!parent || !isContainer(parent)) return;
    const same = srcDoc === dstDoc;
    snapshot(same ? [srcDoc] : [srcDoc, dstDoc], "Move");
    unrenderSubtree(srcDoc, el);
    let node = el;
    if (!same) {
      const clone = el.cloneNode(true);
      inlineStyles(srcDoc, clone);
      el.remove();
      node = dstDoc.dom.importNode(clone, true);
      srcDoc._styleIndex = null;
    }
    if (zone === "inside") { parent.appendChild(node); expanded.add(parent); }
    else if (zone === "before") parent.insertBefore(node, target);
    else target.after(node);
    dstDoc._styleIndex = null;
    dstDoc.dataSource.entities.suspendEvents();
    renderSubtree(dstDoc, node);
    dstDoc.dataSource.entities.resumeEvents();
    markDirty(srcDoc, false);
    if (!same) markDirty(dstDoc, false);
    selected = { doc: dstDoc, el: node };
    revealInTree(dstDoc, node);
  }


  /* ---------------- Multi-selection operations (each is one undo step) ---------------- */
  const countPlacemarks = (els) => els.reduce((n, el) => n + (el.localName === "Placemark" ? 1 : el.getElementsByTagNameNS("*", "Placemark").length), 0);
  async function deleteNodes(doc, els) {
    const n = countPlacemarks(els);
    const ok = await askChoice("Delete selected", `Delete ${els.length} selected items (${n.toLocaleString()} placemark${n === 1 ? "" : "s"} in total)?`, [
      { label: "Delete", danger: true, value: true },
      { label: "Cancel", value: false },
    ]);
    if (!ok) return;
    snapshot([doc], `Delete ${els.length} items`);
    for (const el of els) { unrenderSubtree(doc, el); el.remove(); }
    doc._styleIndex = null;
    selected = null;
    multi.clear();
    viewer.selectedEntity = undefined;
    markDirty(doc);
    toast(`Deleted ${els.length} items — Ctrl+Z to undo`);
  }
  function moveNodes(srcDoc, els, dstDoc, target, zone) {
    const parent = zone === "inside" ? target : target.parentElement;
    if (!parent || !isContainer(parent)) return;
    const same = srcDoc === dstDoc;
    snapshot(same ? [srcDoc] : [srcDoc, dstDoc], `Move ${els.length} items`);
    const moved = [];
    let after = zone === "after" ? target : null;
    for (const el of els) {
      unrenderSubtree(srcDoc, el);
      let node = el;
      if (!same) {
        const clone = el.cloneNode(true);
        inlineStyles(srcDoc, clone);
        el.remove();
        node = dstDoc.dom.importNode(clone, true);
      }
      if (zone === "inside") parent.appendChild(node);
      else if (zone === "before") parent.insertBefore(node, target);
      else { after.after(node); after = node; }
      moved.push(node);
    }
    if (zone === "inside") expanded.add(parent);
    srcDoc._styleIndex = null;
    dstDoc._styleIndex = null;
    dstDoc.dataSource.entities.suspendEvents();
    for (const node of moved) renderSubtree(dstDoc, node);
    dstDoc.dataSource.entities.resumeEvents();
    markDirty(srcDoc, false);
    if (!same) markDirty(dstDoc, false);
    selected = { doc: dstDoc, el: moved[moved.length - 1] };
    multi = new Set(moved);
    anchor = moved[0];
    revealInTree(dstDoc, moved[moved.length - 1]);
    toast(`Moved ${moved.length} items`, 1400);
  }
  function copyNodes(doc, els, { cut = false } = {}) {
    const parts = els.map((el) => { const c = el.cloneNode(true); inlineStyles(doc, c); return new XMLSerializer().serializeToString(c); });
    const xml = KML_CLIP(parts.join(""));
    const paths = imgPaths(xml);
    const assets = (async () => {
      const m = new Map();
      for (const pth of paths) { const b = await assetBlob(doc, pth); if (b) m.set(pth, b); }
      return m;
    })();
    clip = { xml, fromDoc: doc, assets, cut, pastes: 0 };
    clipPending = { text: xml, t: performance.now() };
    if (cut) {
      snapshot([doc], `Cut ${els.length} items`);
      for (const el of els) { unrenderSubtree(doc, el); el.remove(); }
      doc._styleIndex = null;
      selected = null;
      multi.clear();
      viewer.selectedEntity = undefined;
      markDirty(doc);
    }
    toast(`${cut ? "Cut" : "Copied"} ${els.length} items — ${K("paste") || "Paste"} to paste (works in Google Earth too)`, 1800);
    return true;
  }
  /** Move the selected items into a new folder placed where the first one was */
  function groupIntoFolder(doc, els) {
    snapshot([doc], `Group ${els.length} items`);
    const first = els[0];
    const f = newEl(doc.dom, "Folder");
    setChildText(f, "name", "New Folder");
    first.before(f);
    for (const el of els) { unrenderSubtree(doc, el); f.appendChild(el); }
    doc._styleIndex = null;
    doc.dataSource.entities.suspendEvents();
    renderSubtree(doc, f);
    doc.dataSource.entities.resumeEvents();
    expanded.add(f);
    markDirty(doc, false);
    revealInTree(doc, f);
    selectEl(doc, f);
    startRename(doc, f);
  }
  /** Edit actions that follow the selection: several items when multi-selected, else the one item */
  function deleteSelection() {
    const list = selectionList();
    if (list.length > 1) return deleteNodes(selected.doc, list);
    if (selected && selected.el !== selected.doc.root) return deleteNode(selected.doc, selected.el);
  }
  function copySelection(cut) {
    const list = selectionList();
    if (list.length > 1) return copyNodes(selected.doc, list, { cut });
    return selected && copyNode(selected.doc, selected.el, cut ? { cut: true } : undefined);
  }
  function copySelectionMenu(cut) {
    const list = selectionList();
    if (list.length > 1) { copyNodes(selected.doc, list, { cut }); clipPending = null; if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(clip.xml).catch(() => {}); return; }
    if (selected) copyNodeMenu(selected.doc, selected.el, cut);
  }
  function flyToElements(doc, els) {
    const ents = [];
    for (const el of els)
      for (const pm of el.localName === "Placemark" ? [el] : el.getElementsByTagNameNS("*", "Placemark")) ents.push(...(pmEntities.get(pm) || []));
    if (ents.length) viewer.flyTo(ents, { duration: 1.5 });
    else toast("Nothing to fly to in the selection");
  }
  function multiMenu() {
    const doc = selected.doc, list = selectionList();
    const n = countPlacemarks(list);
    return [
      { head: `${list.length} items selected · ${n.toLocaleString()} placemark${n === 1 ? "" : "s"}` },
      { label: "Show All", action: () => setVisibility(doc, list, true) },
      { label: "Hide All", action: () => setVisibility(doc, list, false) },
      { label: "Fly To Selection", action: () => flyToElements(doc, list) },
      "-",
      { label: "Group Into New Folder", action: () => groupIntoFolder(doc, list) },
      { label: "Cut", key: K("cut"), action: () => { copyNodes(doc, list, { cut: true }); if (navigator.clipboard) navigator.clipboard.writeText(clip.xml).catch(() => {}); } },
      { label: "Copy", key: K("copy"), action: () => { copyNodes(doc, list); clipPending = null; if (navigator.clipboard) navigator.clipboard.writeText(clip.xml).catch(() => {}); } },
      { label: "Delete", key: K("delete"), action: () => deleteNodes(doc, list) },
      "-",
      { label: "Clear Selection", key: "` / Esc", action: () => { multi.clear(); selectEl(doc, selected.el); } },
    ];
  }

  /** Save one pin / path / folder (with its styles and photos) as its own KMZ */
  async function exportNodeKmz(doc, el) {
    const name = childText(el, "name") || defaultName(el);
    try {
      const { dom, root } = parseKml(newKmlText(name));
      const clone = el.cloneNode(true);
      inlineStyles(doc, clone);
      root.appendChild(dom.importNode(clone, true));
      const xml = serializeKml(dom);
      const zip = new (await getJSZip())();
      zip.file("doc.kml", xml);
      const paths = new Set([...xml.matchAll(/src=["']((?!https?:|data:|blob:)[^"']+)["']/gi)].map((m) => m[1]));
      for (const p of paths) { const b = await assetBlob(doc, p); if (b) zip.file(p, b); }
      const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE", mimeType: "application/vnd.google-earth.kmz" });
      const fileName = name.replace(/[\\/:*?"<>|]+/g, "_").trim() + ".kmz";
      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({ suggestedName: fileName, types: [KMZ_TYPE] });
          await writeHandle(handle, blob);
          toast("Saved " + handle.name);
          return;
        } catch (e) {
          if (e && e.name === "AbortError") return;
        }
      }
      downloadBlob(blob, fileName);
      toast("Downloaded " + fileName);
    } catch (e) {
      console.error(e);
      toast("Couldn't save: " + e.message, 4000);
    }
  }

  function sortContainer(doc, el) {
    snapshot([doc], "Sort");
    const kids = childEls(el, FEATURE_TAGS);
    kids.sort((a, b) => {
      const fa = isContainer(a) ? 0 : 1, fb = isContainer(b) ? 0 : 1;
      if (fa !== fb) return fa - fb;
      return (childText(a, "name") || "").localeCompare(childText(b, "name") || "", undefined, { numeric: true, sensitivity: "base" });
    });
    for (const k of kids) el.appendChild(k);
    markDirty(doc);
  }

  async function duplicateNode(doc, el) {
    if (el === doc.root) return;
    snapshot([doc], "Duplicate");
    const copy = el.cloneNode(true);
    const nm = childText(copy, "name");
    if (nm) setChildText(copy, "name", nm + " (copy)");
    el.after(copy);
    renderSubtree(doc, copy);
    markDirty(doc, false);
    revealInTree(doc, copy);
    selectEl(doc, copy);
  }

  /* ---------------- Cut / Copy / Paste ----------------
     The clipboard holds real KML (styles inlined, photos carried along), so you can
     also paste into Google Earth, and paste places copied from Google Earth. */
  let clip = null; // { xml, fromDoc, assets: Promise<Map>, cut, pastes }
  let clipPending = null; // KML text for the next native copy/cut event
  const KML_CLIP = (inner) =>
    '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2" xmlns:gx="http://www.google.com/kml/ext/2.2"><Document><name>KmlFile</name>' +
    inner + "</Document></kml>";
  const imgPaths = (xml) => [...new Set([...xml.matchAll(/src=["']((?!https?:|data:|blob:)[^"']+)["']/gi)].map((m) => m[1]))];
  const looksLikeKml = (t) => typeof t === "string" && /<(kml|Placemark|Folder|Document)\b/.test(t);

  function copyNode(doc, el, { cut = false, quiet = false } = {}) {
    if (!doc || !el) return false;
    if (cut && el === doc.root) { toast("Use Close to remove a whole file"); return false; }
    let node = el.cloneNode(true);
    inlineStyles(doc, node);
    if (node.localName === "Document") {
      // a whole file becomes a folder when pasted
      const f = newEl(node, "Folder");
      for (const k of [...node.childNodes]) if (!(k.nodeType === 1 && ["Style", "StyleMap", "Schema"].includes(k.localName))) f.appendChild(k);
      if (!childText(f, "name")) setChildText(f, "name", docName(doc));
      node = f;
    }
    const xml = KML_CLIP(new XMLSerializer().serializeToString(node));
    const paths = imgPaths(xml);
    const assets = (async () => {
      const m = new Map();
      for (const p of paths) { const b = await assetBlob(doc, p); if (b) m.set(p, b); }
      return m;
    })();
    clip = { xml, fromDoc: doc, assets, cut, pastes: 0 };
    clipPending = { text: xml, t: performance.now() };
    const name = childText(el, "name") || defaultName(el);
    if (cut) {
      snapshot([doc], "Cut");
      unrenderSubtree(doc, el);
      el.remove();
      doc._styleIndex = null;
      selected = null;
      viewer.selectedEntity = undefined;
      markDirty(doc);
    }
    if (!quiet) toast(`${cut ? "Cut" : "Copied"} "${name || "item"}" — ${K("paste") || "Paste"} to paste (works in Google Earth too)`, 1800);
    return true;
  }
  /** Menu-driven copy/cut: also try the system clipboard (keyboard copy uses the native event instead) */
  function copyNodeMenu(doc, el, cut) {
    if (!copyNode(doc, el, { cut })) return;
    clipPending = null;
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(clip.xml).catch(() => {});
  }
  function pasteTarget() {
    if (selected && docs.includes(selected.doc) && selected.el.isConnected) {
      if (isContainer(selected.el)) return { doc: selected.doc, parent: selected.el, after: null };
      const p = selected.el.parentElement;
      if (p && isContainer(p)) return { doc: selected.doc, parent: p, after: selected.el };
    }
    return { doc: myPlaces, parent: myPlaces.root, after: null };
  }
  /** Paste KML text (ours or from Google Earth) into the selected folder / after the selected item */
  async function pasteKml(text, { assets = null, fromDoc = null, keepShortcuts = false, target = pasteTarget() } = {}) {
    let parsed;
    try { parsed = parseKml(text); } catch (e) { toast("Clipboard doesn't contain KML places"); return false; }
    const src = { dom: parsed.dom, _styleIndex: null };
    const top = parsed.root;
    let items = top.localName === "Document" ? childEls(top, FEATURE_TAGS) : [top];
    if (!items.length) { toast("Nothing to paste"); return false; }
    const dst = target.doc;
    // photos: carry the image files; rename if the destination already uses that path
    let xmlMap = null;
    if (assets && assets.size && fromDoc !== dst) {
      xmlMap = new Map();
      const dstXml = serializeKml(dst.dom);
      for (const [p, blob] of assets) {
        let np = p;
        if (dst.assets.has(p) || dstXml.includes(p)) np = uniqueAssetPath(dst, p.split("/").pop());
        dst.assets.set(np, blob);
        if (np !== p) xmlMap.set(p, np);
      }
    }
    const entry = snapshot([dst], "Paste");
    const added = [];
    let after = target.after;
    for (const it of items) {
      inlineStyles(src, it);
      let node = dst.dom.importNode(it, true);
      if (xmlMap && xmlMap.size) {
        for (const d of [node, ...node.getElementsByTagNameNS("*", "description")]) {
          if (d.localName !== "description") continue;
          let t = d.textContent;
          for (const [a, b] of xmlMap) t = t.split(a).join(b);
          d.textContent = t;
        }
      }
      if (!keepShortcuts) for (const pm of [node, ...node.getElementsByTagNameNS("*", "Placemark")]) if (pm.localName === "Placemark") removeData(pm, "shortcut");
      if (after) { after.after(node); after = node; }
      else target.parent.appendChild(node);
      added.push(node);
      for (const c of [node, ...CONTAINER_TAGS.flatMap((t) => [...node.getElementsByTagNameNS("*", t)])])
        if (isContainer(c) && childText(c, "open") === "1") expanded.add(c);
    }
    dst._styleIndex = null;
    dst.dataSource.entities.suspendEvents();
    for (const n of added) renderSubtree(dst, n);
    dst.dataSource.entities.resumeEvents();
    expanded.add(target.parent);
    markDirty(dst, false);
    const last = added[added.length - 1];
    revealInTree(dst, last);
    selectEl(dst, last);
    toast(added.length === 1 ? `Pasted "${childText(last, "name") || defaultName(last) || "item"}"` : `Pasted ${added.length} items`, 1400);
    return entry;
  }
  /** Paste from our own clipboard */
  async function pasteClip() {
    if (!clip) return false;
    const assets = await clip.assets;
    const keep = clip.cut && clip.pastes === 0; // a cut item keeps its shortcut the first time it lands
    const ok = await pasteKml(clip.xml, { assets, fromDoc: clip.fromDoc, keepShortcuts: keep });
    if (ok) clip.pastes++;
    return ok;
  }
  /** Menu Paste: our clipboard first, else the system clipboard (e.g. copied in Google Earth) */
  async function pasteMenu() {
    if (clip) return pasteClip();
    try {
      const t = navigator.clipboard && (await navigator.clipboard.readText());
      if (looksLikeKml(t)) return pasteKml(t);
    } catch (e) { /* permission denied */ }
    toast(`Nothing to paste — copy a place first (in Google Earth, copy then press ${K("paste") || "Ctrl+V"} here)`, 3000);
    return false;
  }
  // Native clipboard events: put KML on the system clipboard, accept KML from Google Earth
  const clipEventOk = (e) => !isTyping(document.activeElement) && !isTyping(e.target) && !activeDialog;
  for (const type of ["copy", "cut"]) {
    document.addEventListener(type, (e) => {
      if (!clipEventOk(e) || !clipPending || performance.now() - clipPending.t > 1500) return;
      e.clipboardData.setData("text/plain", clipPending.text);
      e.preventDefault();
      clipPending = null;
    });
  }
  let pasteFallback = null;
  document.addEventListener("paste", (e) => {
    const imgs = clipboardImages(e.clipboardData);
    // An open dialog that takes photos (pin Properties) gets pasted images; text pastes into fields as normal
    if (imgs.length && activeDialog) {
      if (activeDialog.onPaste) { e.preventDefault(); activeDialog.onPaste(imgs); }
      return;
    }
    if (!clipEventOk(e)) return;
    clearTimeout(pasteFallback);
    pasteFallback = null;
    const t = e.clipboardData ? e.clipboardData.getData("text/plain") : "";
    e.preventDefault();
    if (looksLikeKml(t) && (!clip || t !== clip.xml)) pasteKml(t);
    else if (imgs.length) pastePhotosOnSelected(imgs);
    else if (clip) pasteClip();
    else toast("Clipboard doesn't contain places");
  });
  /** Ctrl+V an image with a pin selected → add it to the pin's photos (undoable) */
  async function pastePhotosOnSelected(files) {
    const sel = selected;
    if (!sel || sel.el.localName !== "Placemark") { toast("Select a placemark first, then paste to add the image to it", 2600); return; }
    const { doc, el } = sel;
    const { desc, added } = await appendPhotos(doc, childText(el, "description"), files, false);
    if (!added) return;
    snapshot([doc], added === 1 ? "Add photo" : "Add photos");
    setChildText(el, "description", desc);
    rerenderPlacemark(doc, el);
    markDirty(doc);
    toast(`Added ${added === 1 ? "photo" : added + " photos"} to “${childText(el, "name") || defaultName(el) || "placemark"}”`, 1800);
  }

  function rowMenu(doc, el) {
    const isRoot = el === doc.root;
    const cont = isContainer(el);
    const pt = el.localName === "Placemark" ? pointOf(el) : null;
    const items = [];
    items.push({ label: "Fly To", key: "Dbl-click", action: () => flyToFeature(doc, el) });
    if (pt) items.push({ label: "Ground View Here", action: () => groundViewAt(pt.lon, pt.lat) });
    const lineCoords = el.localName === "Placemark" ? collectGeoms(el).filter((g) => g.type === "line").flatMap((g) => g.coords) : [];
    if (lineCoords.length > 1) items.push({ label: "Elevation Profile", action: () => showLineProfile(lineCoords, childText(el, "name")) });
    items.push("-");
    if (cont) {
      items.push({ label: "Add Placemark Here…", key: K("addPin"), action: () => { selectEl(doc, el); startAddPin(); } });
      items.push({ label: "New Folder Inside", key: K("folder"), action: () => { selectEl(doc, el); newFolder(); } });
      items.push({ label: "Save Current View Here", key: K("viewpoint"), action: () => { selectEl(doc, el); addViewpoint(); } });
      items.push({ label: "Sort A → Z", action: () => sortContainer(doc, el) });
      items.push("-");
    }
    items.push({ label: "Rename", key: K("rename"), action: () => startRename(doc, el) });
    items.push({ label: "Properties…", key: K("props"), action: () => openProperties(doc, el) });
    items.push("-");
    if (!isRoot) items.push({ label: "Cut", key: K("cut"), action: () => copyNodeMenu(doc, el, true) });
    items.push({ label: "Copy", key: K("copy"), action: () => copyNodeMenu(doc, el, false) });
    items.push({ label: cont ? "Paste Into Folder" : "Paste After", key: K("paste"), disabled: !clip, action: () => { selectEl(doc, el); pasteMenu(); } });
    if (!isRoot) items.push({ label: "Duplicate", key: K("duplicate"), action: () => duplicateNode(doc, el) });
    items.push("-");
    if (el.localName === "Placemark") items.push({ label: getData(el, "shortcut") ? `Change Shortcut (${getData(el, "shortcut")})…` : "Assign Shortcut…", action: () => assignPlaceShortcut(doc, el) });
    if (!isRoot) items.push({ label: "Save Place As KMZ…", action: () => exportNodeKmz(doc, el) });
    if (pt) {
      items.push({ label: "Copy Coordinates (decimal)", action: () => copyText(formatDecimal(pt.lat, pt.lon)) });
      items.push({ label: "Copy Coordinates (DMS)", action: () => copyText(formatDMS(pt.lat, pt.lon)) });
    }
    items.push("-");
    if (isRoot) {
      items.push({ label: "Save", key: K("save"), action: () => saveDoc(doc) });
      items.push({ label: "Save As…", key: K("saveAs"), action: () => saveDocAs(doc) });
      items.push({ label: "Close", disabled: doc.isMyPlaces, action: () => closeDoc(doc) });
    } else {
      items.push({ label: "Delete", key: K("delete"), action: () => deleteNode(doc, el) });
    }
    return items;
  }

  /* ------------------------------------------------------------------
     Properties dialog
     ------------------------------------------------------------------ */
  function swatchPicker(current, onPick) {
    const wrap = h("div", { class: "ts-swatches" });
    let cur = (current || "").toLowerCase();
    const custom = h("input", { type: "color", value: cur && /^#[0-9a-f]{6}$/.test(cur) ? cur : "#ffd400", title: "Custom colour", style: { width: "30px", height: "24px", padding: "0" } });
    const redraw = () => {
      for (const s of wrap.querySelectorAll(".ts-swatch")) s.classList.toggle("on", s.dataset.c === cur);
    };
    for (const [name, css] of Object.entries(PIN_COLORS)) {
      const s = h("div", { class: "ts-swatch", title: name, style: { background: css } });
      s.dataset.c = css.toLowerCase();
      s.addEventListener("click", () => { cur = s.dataset.c; custom.value = cur; redraw(); onPick(cur); });
      wrap.appendChild(s);
    }
    custom.addEventListener("input", () => { cur = custom.value.toLowerCase(); redraw(); onPick(cur); });
    wrap.appendChild(custom);
    redraw();
    return wrap;
  }

  function openProperties(doc, el, { isNew = false, entry = null } = {}) {
    const isRoot = el === doc.root;
    const isPm = el.localName === "Placemark";
    const kind = isPm ? geomKind(el) : "none";
    const st = isPm ? resolveStyle(doc, el) : null;
    const isView = isPm && !!childEl(el, "Camera");
    const pt = isPm && !isView ? pointOf(el) : null;

    const state = {
      name: isRoot ? docName(doc) : childText(el, "name") || (isPm ? "" : defaultName(el)),
      desc: childText(el, "description"),
      color: isPm ? (kind === "point" ? pinCss(st) : lineCss(st)) : null,
      colorChanged: false,
      width: st ? st.lineWidth || 2 : 2,
      fill: st && kind === "polygon" ? (kmlColorToRgba(st.polyColor) || { a: 0.3 }).a : 0.3,
      lon: pt ? pt.lon : null,
      lat: pt ? pt.lat : null,
      moved: false,
      updateCamera: false,
      shortcut: isPm ? getData(el, "shortcut") || "" : "",
      alwaysShow: isPm ? isAlwaysShow(el) : false,
    };
    let committed = false;
    let stopShortcutCapture = () => {};

    const nameIn = h("input", { type: "text", value: state.name });
    const body = h("div", {}, h("label", {}, "Name", nameIn));

    let coordIn = null, dmsOut = null, elevOut = null;
    const previewPin = () => {
      for (const e of pmEntities.get(el) || []) {
        if (pointInfo.has(e)) {
          pointInfo.set(e, { lon: state.lon, lat: state.lat });
          queueSnap(e, state.lon, state.lat);
        }
      }
    };
    const refreshCoordText = async () => {
      dmsOut.textContent = formatDMS(state.lat, state.lon);
      elevOut.textContent = "Elevation: …";
      elevOut.textContent = "Elevation: " + fmtElev(await terrainHeightAt(state.lon, state.lat));
    };
    if (pt) {
      coordIn = h("input", { type: "text", value: formatDecimal(state.lat, state.lon) });
      dmsOut = h("div", { class: "ts-hint" });
      elevOut = h("div", { class: "ts-hint" });
      coordIn.addEventListener("change", () => {
        const c = parseCoordinates(coordIn.value);
        if (!c) { toast("Couldn't read those coordinates"); return; }
        state.lat = c.lat; state.lon = c.lon; state.moved = true;
        coordIn.value = formatDecimal(c.lat, c.lon);
        previewPin();
        refreshCoordText();
      });
      body.append(
        h("label", { style: { marginTop: "8px" } }, "Location (decimal or DMS — paste any format)", coordIn),
        dmsOut, elevOut,
        h("div", { class: "ts-hint" }, "Tip: click anywhere on the map to move this pin there.")
      );
      refreshCoordText();
      setTool({
        name: "movePin",
        hint: "Click the map to move the pin · ` or Esc when done",
        cursor: "crosshair",
        onClick: (cart) => {
          const c = Cesium.Cartographic.fromCartesian(cart);
          state.lon = Cesium.Math.toDegrees(c.longitude);
          state.lat = Cesium.Math.toDegrees(c.latitude);
          state.moved = true;
          coordIn.value = formatDecimal(state.lat, state.lon);
          previewPin();
          refreshCoordText();
        },
      });
    }

    if (isPm && !isView && kind !== "none" && kind !== "multi") {
      body.append(h("div", { style: { marginTop: "8px", opacity: 0.9 } }, kind === "point" ? "Pin colour" : "Line colour"),
        swatchPicker(state.color, (c) => { state.color = c; state.colorChanged = true; }));
    }
    if (kind === "line" || kind === "polygon") {
      const wIn = h("input", { type: "range", min: 1, max: 8, step: 1, value: state.width });
      wIn.addEventListener("input", () => { state.width = +wIn.value; state.colorChanged = true; });
      body.append(h("label", {}, "Line width", wIn));
      const coords = collectGeoms(el).filter((g) => g.type === "line").map((g) => g.coords);
      if (coords.length) {
        const pb = h("button", {}, "Show Elevation Profile");
        pb.addEventListener("click", () => showLineProfile(coords.flat(), nameIn.value.trim() || state.name));
