  /* ------------------------------------------------------------------
     Keyboard
     ------------------------------------------------------------------ */
  const WALK_KEYS = new Set(["w", "a", "s", "d", "q", "e", "arrowup", "arrowdown", "arrowleft", "arrowright"]);
  const FLY_KEYS = new Set(["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright"]);
  function placeForKey(ks) {
    for (const d of docs) {
      for (const data of d.root.getElementsByTagNameNS("*", "Data")) {
        if (data.getAttribute("name") === "shortcut" && childText(data, "value") === ks) {
          const pm = data.parentElement && data.parentElement.parentElement;
          if (pm && pm.localName === "Placemark") return { doc: d, pm };
        }
      }
    }
    return null;
  }
  // ` (the key under Esc) does everything Esc does. In Sandcastle's full-screen view the browser keeps Esc
  // for itself (exit full screen) and a framed page can't stop that, so ` is re-sent as an Escape key press.
  // Runs first (capture phase, registered before every other key handler). Text boxes still type a `.
  window.addEventListener("keydown", (e) => {
    if (e.key !== "`" || e.ctrlKey || e.metaKey || e.altKey || !e.isTrusted) return;
    const t = e.target;
    if (isTyping(t)) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    (t && t.dispatchEvent ? t : window).dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", code: "Escape", bubbles: true, cancelable: true }));
  }, true);
  window.addEventListener("keydown", (e) => {
    walk.shift = e.shiftKey;
    walk.ctrl = e.ctrlKey;
    if (capturingKey) return;
    const ks = keyString(e);
    if (!ks) return;
    const typing = isTyping(e.target);
    const action = ACTIONS.find((a) => keyFor(a.id) === ks);
    if (typing) {
      if (action && action.anywhere) { e.preventDefault(); action.run(); }
      return;
    }
    if (tool && tool.onKey && tool.onKey(e)) { e.preventDefault(); return; }
    const kl = e.key.toLowerCase();
    if (!e.ctrlKey && !e.metaKey && !e.altKey && (walk.active ? WALK_KEYS : FLY_KEYS).has(kl)) {
      walk.keys.add(kl);
      e.preventDefault();
      return;
    }
    if (e.key === "Escape") {
      const hadMenu = !!document.querySelector(".ts-dropdown");
      closeDropdown();
      if (tool) cancelTool();
      else if (walk.active) exitWalk();
      else if (activeDialog) closeDialog();
      else if (elev.el) closeElevation();
      else if (!hadMenu && multiActive()) { multi.clear(); selectEl(selected.doc, selected.el); } // Esc on an open menu only closes the menu
      else if (settings.lens.on) toggleLens();
      else if (searchMarker) { tempDs.entities.remove(searchMarker); searchMarker = null; }
      return;
    }
    if (ks === "Ctrl+Shift+Z") { e.preventDefault(); redo(); return; }
    if (action && action.native && ["Ctrl+C", "Ctrl+X", "Ctrl+V"].includes(ks)) {
      // let the browser fire its copy/cut/paste event (that's what reaches the system clipboard)
      if (action.id === "paste") {
        clearTimeout(pasteFallback);
        pasteFallback = setTimeout(() => { pasteFallback = null; action.run(); }, 250); // if no paste event arrives
      } else action.run();
      return;
    }
    if (action) {
      e.preventDefault();
      action.run();
      return;
    }
    const place = placeForKey(ks);
    if (place) {
      e.preventDefault();
      flyToFeature(place.doc, place.pm);
      toast("→ " + (childText(place.pm, "name") || "Placemark"), 1200);
    }
  });
  window.addEventListener("keyup", (e) => {
    walk.shift = e.shiftKey;
    walk.ctrl = e.ctrlKey;
    walk.keys.delete(e.key.toLowerCase());
  });
  window.addEventListener("blur", () => walk.keys.clear());

  /* ---------------- Shortcut capture + manager ---------------- */
  let capturingKey = false;
  function captureKey(title, message) {
    return new Promise((resolve) => {
      const box = h("div", { style: { textAlign: "center", padding: "18px", fontSize: "15px", border: "1px dashed #6aa0ff", borderRadius: "6px" } }, "Press a key or combination…");
      capturingKey = true;
      const onKey = (e) => {
        const ks = keyString(e);
        if (!ks) return;
        e.preventDefault();
        e.stopPropagation();
        if (ks === "Escape") return done(null);
        done(ks);
      };
      const done = (v) => {
        capturingKey = false;
        window.removeEventListener("keydown", onKey, true);
        closeDialog();
        resolve(v);
      };
      window.addEventListener("keydown", onKey, true);
      showDialog({
        title,
        body: h("div", {}, message ? h("div", { class: "ts-hint", style: { marginBottom: "8px" } }, message) : null, box,
          h("div", { class: "ts-hint", style: { marginTop: "8px" } }, "` or Esc cancels. Walk keys (W A S D Q E, arrows), ` and Esc are reserved.")),
        buttons: [{ label: "Clear shortcut", action: () => { done(""); return false; } }, { label: "Cancel", action: () => { done(null); return false; } }],
        onClose: () => { if (capturingKey) { capturingKey = false; window.removeEventListener("keydown", onKey, true); resolve(null); } },

  }
  const RESERVED = new Set(["W", "A", "S", "D", "Q", "E", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Escape", "`", "Tab"]);
  function whoUses(ks) {
    const a = ACTIONS.find((x) => keyFor(x.id) === ks);
    if (a) return { kind: "action", a, name: a.label };
    const p = placeForKey(ks);
    if (p) return { kind: "place", p, name: childText(p.pm, "name") || "Placemark" };
    return null;
  }
  async function resolveConflict(ks, selfTest) {
    if (RESERVED.has(ks)) { toast(`${ks} is reserved for walking/flying`); return false; }
    const u = whoUses(ks);
    if (!u || selfTest(u)) return true;
    const ok = await askChoice("Shortcut in use", `${ks} is already used by “${u.name}”. Move it here?`,
      [{ label: "Move it here", primary: true, value: true }, { label: "Cancel", value: false }]);
    if (!ok) return false;
    if (u.kind === "action") settings.keys[u.a.id] = "";
    else { snapshot([u.p.doc], "Reassign shortcut"); removeData(u.p.pm, "shortcut"); markDirty(u.p.doc); }
    return true;
  }
  async function assignPlaceShortcut(doc, pm) {
    const nm = childText(pm, "name") || "Placemark";
    const ks = await captureKey(`Shortcut for “${nm}”`, "Pressing it will fly straight to this viewpoint/placemark. It's saved inside the file.");
    if (ks === null) return;
    if (ks && !(await resolveConflict(ks, (u) => u.kind === "place" && u.p.pm === pm))) return;
    snapshot([doc], "Shortcut");

  function openShortcutManager() {
    const body = h("div", { style: { maxHeight: "62vh", overflow: "auto", paddingRight: "4px" } });

        const btn = h("button", { style: { minWidth: "120px" } }, keyFor(a.id) || "—");
        btn.addEventListener("click", async () => {

      }

      const places = [];
      for (const d of docs) for (const pm of d.root.getElementsByTagNameNS("*", "Placemark")) {
        if (getData(pm, "shortcut")) places.push({ d, pm });
      }
      if (!places.length) body.append(h("div", { class: "ts-hint" }, "None yet. Give a pin or viewpoint a shortcut in its Properties, or right-click it → Assign Shortcut."));
      for (const { d, pm } of places) {
        const btn = h("button", { style: { minWidth: "120px" } }, getData(pm, "shortcut") || "—");
        btn.addEventListener("click", async () => { await assignPlaceShortcut(d, pm); openShortcutManager(); });
        body.append(h("div", { class: "ts-line", style: { justifyContent: "space-between" } },
          h("span", {}, (childEl(pm, "Camera") ? "📷 " : "📍 ") + (childText(pm, "name") || "Placemark"), h("span", { class: "ts-hint" }, "  " + docName(d))), btn));
      }
    };
    draw();
    showDialog({
      title: "Keyboard Shortcuts",
      width: 560,
      body,
      buttons: [
        { label: "Reset to defaults", action: () => { settings.keys = {}; saveSettings(); draw(); return false; } },
        { label: "Done", primary: true },
      ],
    });
  }

  /* X = straight up to the extract height, north up. Quick double-X = the higher one. */
  let lastExtract = { t: 0, lon: 0, lat: 0 };
  function extractView() {
    if (walk.active) exitWalk();
    if (tool) cancelTool();
    const now = performance.now();
    const dbl = now - lastExtract.t < 450;
    let lon, lat;
    if (dbl) ({ lon, lat } = lastExtract);
    else { const c = camera.positionCartographic; lon = c.longitude; lat = c.latitude; }
    lastExtract = { t: dbl ? 0 : now, lon, lat };
    const ft = dbl ? settings.extractHighFt : settings.extractFt;
    camera.flyTo({
      destination: Cesium.Cartesian3.fromRadians(lon, lat, ft * 0.3048),
      orientation: { heading: 0, pitch: -Cesium.Math.PI_OVER_TWO, roll: 0 },
      duration: 0.6,
      maximumHeight: ft * 0.3048,
    });
  }

  /* ---------- Compass (true north; click to face north) ---------- */
  const compassEl = (() => {
    const NS = "http://www.w3.org/2000/svg";

    const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; };

    const rose = mk("g", {});
    for (let d = 0; d < 360; d += 15) {

    for (const [t, d] of [["N", 0], ["E", 90], ["S", 180], ["W", 270]]) {
      const g = mk("g", { transform: `rotate(${d}) translate(0 -27) rotate(${-d})` }, rose);
      const tx = mk("text", { "text-anchor": "middle", "dominant-baseline": "central", "font-size": t === "N" ? 14 : 11, "font-weight": 700, fill: t === "N" ? "#ff4d3d" : "#eee", "font-family": "system-ui,sans-serif" }, g);
      tx.textContent = t;
    }
    mk("path", { d: "M0,-16 L5,0 L-5,0 Z", fill: "#ff4d3d" }, rose);
    mk("path", { d: "M0,16 L5,0 L-5,0 Z", fill: "#ccc" }, rose);
    mk("circle", { r: 2.5, fill: "#111" });
    mk("path", { d: "M0,-49 L4,-43 L-4,-43 Z", fill: "#ffd400" }); // lubber mark = direction you're facing
    const hd = h("div", { class: "hd" }, "");
    const el = h("div", { id: "ts-compass", title: `Compass — click to face north (toggle: ${K("compass") || "View menu"})` }, svg, hd);
    el.addEventListener("click", () => {
      // turn in place to face north (keeps position and tilt)
      const pos = camera.positionWC.clone(), pitch = camera.pitch, h0 = camera.heading;
      const dh = Cesium.Math.negativePiToPi(0 - h0), t0 = performance.now(), dur = 500;
      const step = (now) => {
        const k = Math.min(1, (now - t0) / dur), e = k * k * (3 - 2 * k);
        camera.setView({ destination: pos, orientation: { heading: h0 + dh * e, pitch, roll: 0 } });
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
    ui.main.appendChild(el);
    return { el, rose, hd, labels: [...rose.querySelectorAll("text")] };
  })();
  let compassLast = NaN;
  function updateCompass() {
    compassEl.el.style.display = settings.compass ? "" : "none";
    viewer.container.classList.toggle("ts-has-compass", !!settings.compass);
    if (!settings.compass) return;
    const deg = ((Cesium.Math.toDegrees(camera.heading) % 360) + 360) % 360;
    if (Math.abs(deg - compassLast) < 0.05) return;
    compassLast = deg;
    compassEl.rose.setAttribute("transform", `rotate(${-deg})`);
    for (const t of compassEl.labels) t.setAttribute("transform", `rotate(${deg})`); // keep letters upright
    compassEl.hd.textContent = `${Math.round(deg) % 360}° ${compass(deg)}`;
  }
  scene.postRender.addEventListener(updateCompass);
  function toggleCompass() {
    settings.compass = !settings.compass;
    saveSettings();
    compassLast = NaN;
    updateCompass();
    toast(settings.compass ? "Compass on" : "Compass off", 900);
  }
  function updateFlyHud() {
    flyHud.style.display = settings.flyHud ? "" : "none";
  }
  function toggleFlyHud() {
    settings.flyHud = !settings.flyHud;
    saveSettings();
    updateToolButtons();
  }
  let hudTimer = 0;
  scene.postRender.addEventListener(() => {
    if (!settings.flyHud) return;
    const now = performance.now();
    if (now - hudTimer < 200) return;
    hudTimer = now;
    const c = camera.positionCartographic;
    const g = globe.getHeight(c);
    const hd = (Cesium.Math.toDegrees(camera.heading) + 360) % 360;
    const ft = (m) => Math.round(m * 3.28084).toLocaleString() + " ft";
    flyRead.textContent = `Above ground ${g !== undefined ? ft(c.height - g) : "—"} · Altitude ${ft(c.height)} · Heading ${Math.round(hd)}° ${compass(hd)} · Tilt ${Math.round(Cesium.Math.toDegrees(camera.pitch))}°`;
  });
  updateFlyHud();

  /* ------------------------------------------------------------------
     Screenshot (crops to the photo frame when one is shown)
     ------------------------------------------------------------------ */
  function screenshot() {
    const remove = scene.postRender.addEventListener(() => {
      remove();
      let sx = 0, sy = 0, sw = canvas.width, sh = canvas.height;
      if (frameEl.style.display === "block") {
        const cr = canvas.getBoundingClientRect(), fr = frameEl.getBoundingClientRect();
        const k = canvas.width / cr.width;
        sx = Math.round((fr.left - cr.left) * k); sy = Math.round((fr.top - cr.top) * k);
        sw = Math.round(fr.width * k); sh = Math.round(fr.height * k);
      }
      const out = document.createElement("canvas");
      out.width = sw; out.height = sh;
      out.getContext("2d").drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
      const stamp = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, "");
      out.toBlob((b) => { downloadBlob(b, `terrain-scout_${stamp}.png`); toast("Screenshot saved"); }, "image/png");
    });
    scene.requestRender();
  }

  /* ------------------------------------------------------------------
     Drop KML/KMZ files anywhere to open them
     ------------------------------------------------------------------ */
  ui.app.addEventListener("dragover", (e) => {
    if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) e.preventDefault();
  });
  ui.app.addEventListener("drop", async (e) => {
    if (!e.dataTransfer || !e.dataTransfer.files.length) return;
    e.preventDefault();
    for (const f of e.dataTransfer.files) {
      if (/\.(kml|kmz|gpx)$/i.test(f.name)) await openFile(f, null);
      else toast(`${f.name} isn't a KML, KMZ or GPX file`);
    }
  });
  window.addEventListener("beforeunload", () => { autosaveNow(); });

  // Remember the camera between sessions
  camera.moveEnd.addEventListener(s2OnMoveEnd);
  camera.moveEnd.addEventListener(() => {
    const c = camera.positionCartographic;
    settings.camera = { lon: Cesium.Math.toDegrees(c.longitude), lat: Cesium.Math.toDegrees(c.latitude), h: c.height,
      heading: camera.heading, pitch: camera.pitch };
    saveSettings();
  });

  /* ------------------------------------------------------------------
     Start-up
     ------------------------------------------------------------------ */
  applyQuality();
  const withTimeout = (pr, ms) => Promise.race([pr, new Promise((res) => setTimeout(res, ms))]);
  await withTimeout(setBaseImagery(settings.baseImagery), 8000);
  if (settings.referenceOverlay) setReferenceOverlay(true);
  if (settings.roadsOverlay) setRoadsOverlay(true);
  if (settings.water.on) applyWater();
  if (!settings.landcover) settings.landcover = { on: false, opacity: 0.6, hideTrees: true, source: "esa" };
  if (settings.landcover.on) applyLandcover();

  let session = null;
  try { session = await idb.get("session"); } catch (e) { /* storage unavailable */ }
  if (Array.isArray(session)) {
    for (const s of session) {
      try {
        createDoc(s.xml, { fileName: s.fileName, dirty: s.dirty, isMyPlaces: s.isMyPlaces, kmz: s.kmz, handle: s.handle, assets: s.assets });
      } catch (e) { console.warn("Couldn't restore", s.fileName, e); }
    }
  }
  myPlaces = docs.find((d) => d.isMyPlaces);
  if (!myPlaces) myPlaces = createDoc(newKmlText("My Places"), { fileName: "My Places.kmz", isMyPlaces: true });

  if (settings.ionListToken) refreshIonAssets(true);
  if (settings.terrainId && settings.terrainId !== 1) await withTimeout(loadTerrain(settings.terrainId, { fly: false, quiet: true }), 10000);

  if (settings.camera) {
    const c = settings.camera;
    camera.setView({ destination: Cesium.Cartesian3.fromDegrees(c.lon, c.lat, c.h), orientation: { heading: c.heading, pitch: c.pitch, roll: 0 } });
  } else {
    camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(-134.2, 57.9, 160000),
      orientation: { heading: 0, pitch: Cesium.Math.toRadians(-45), roll: 0 },
    });
  }
  applyLens();
  applySun();
  applyShade();
  renderTree();
  refreshPanel();
  const restored = docs.filter((d) => !d.isMyPlaces).length;
  toast(restored ? `Restored ${restored} open file${restored > 1 ? "s" : ""} from last session · press ? for shortcuts` : "Welcome — press ? for shortcuts and tips", 4500);
}

main().catch((err) => {
  console.error(err);
  const msg = document.createElement("div");
  msg.style.cssText = "position:fixed;top:10px;left:10px;right:10px;padding:12px;background:#8a2f2f;color:#fff;font:14px sans-serif;z-index:99999;border-radius:6px";
  msg.textContent = "Terrain Scout failed to start: " + (err && err.message ? err.message : err);
  document.body.appendChild(msg);
});
